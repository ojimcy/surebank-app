<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Clean Modern Design -->
  
  <!-- Circular Background -->
  <circle cx="256" cy="256" r="230" fill="url(#backgroundGrad)"/>
  
  <!-- Main Icon -->
  <g transform="translate(256, 256)">
    <!-- Shopping Bag Silhouette -->
    <g>
      <!-- Bag Body -->
      <path d="M-75 -10 L-75 110 Q-75 130 -55 130 L55 130 Q75 130 75 110 L75 -10 Q75 -30 55 -30 L-55 -30 Q-75 -30 -75 -10Z" 
            fill="#FFFFFF"/>
      
      <!-- Bag Handles -->
      <path d="M-35 -30 Q-35 -70 0 -70 Q35 -70 35 -30" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="12" 
            stroke-linecap="round"/>
    </g>
    
    <!-- Savings Integration - Coin with S -->
    <g transform="translate(0, 40)">
      <!-- Coin Background -->
      <circle cx="0" cy="0" r="45" fill="url(#coinGrad)"/>
      
      <!-- S Symbol for Savings/Surebank -->
      <path d="M-15 -15 Q-15 -25 0 -25 Q15 -25 15 -12 Q15 -2 0 0 Q-15 2 -15 12 Q-15 25 0 25 Q15 25 15 15" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="8" 
            stroke-linecap="round"/>
      
      <!-- Currency Lines -->
      <line x1="0" y1="-32" x2="0" y2="-25" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="25" x2="0" y2="32" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    </g>
    
    <!-- Growth Indicator -->
    <g transform="translate(0, -80)">
      <path d="M0 15 L0 0 M-8 8 L0 0 L8 8" 
            stroke="#9FD12B" 
            stroke-width="8" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </g>
    
    <!-- Shopping Cart Wheel Detail -->
    <g transform="translate(-35, 130)">
      <circle cx="0" cy="0" r="8" fill="#0066A1"/>
    </g>
    <g transform="translate(35, 130)">
      <circle cx="0" cy="0" r="8" fill="#0066A1"/>
    </g>
  </g>
  
  <!-- Gradient Definitions -->
  <defs>
    <radialGradient id="backgroundGrad">
      <stop offset="0%" style="stop-color:#0078C1" />
      <stop offset="100%" style="stop-color:#0066A1" />
    </radialGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B4E333" />
      <stop offset="50%" style="stop-color:#9FD12B" />
      <stop offset="100%" style="stop-color:#8BC023" />
    </linearGradient>
  </defs>
</svg>