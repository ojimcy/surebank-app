<svg width="400" height="120" viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- White/Reversed Icon Section -->
  <g transform="translate(60, 60) scale(0.234375)">
    <!-- Circular Background -->
    <circle cx="0" cy="0" r="230" fill="#FFFFFF"/>
    
    <!-- Shopping Bag Silhouette -->
    <g>
      <!-- Bag Body -->
      <path d="M-75 -10 L-75 110 Q-75 130 -55 130 L55 130 Q75 130 75 110 L75 -10 Q75 -30 55 -30 L-55 -30 Q-75 -30 -75 -10Z" 
            fill="#2c3e50"/>
      
      <!-- Bag Handles -->
      <path d="M-35 -30 Q-35 -70 0 -70 Q35 -70 35 -30" 
            fill="none" 
            stroke="#2c3e50" 
            stroke-width="12" 
            stroke-linecap="round"/>
    </g>
    
    <!-- Savings Integration - Coin with S -->
    <g transform="translate(0, 40)">
      <!-- Coin Background -->
      <circle cx="0" cy="0" r="45" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#2c3e50" stroke-width="4"/>
      
      <!-- S Symbol for Savings/Surebank -->
      <path d="M-15 -15 Q-15 -25 0 -25 Q15 -25 15 -12 Q15 -2 0 0 Q-15 2 -15 12 Q-15 25 0 25 Q15 25 15 15" 
            fill="none" 
            stroke="#2c3e50" 
            stroke-width="8" 
            stroke-linecap="round"/>
      
      <!-- Currency Lines -->
      <line x1="0" y1="-32" x2="0" y2="-25" stroke="#2c3e50" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="25" x2="0" y2="32" stroke="#2c3e50" stroke-width="6" stroke-linecap="round"/>
    </g>
    
    <!-- Growth Indicator -->
    <g transform="translate(0, -80)">
      <path d="M0 15 L0 0 M-8 8 L0 0 L8 8" 
            stroke="#FFFFFF" 
            stroke-width="8" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </g>
    
    <!-- Shopping Cart Wheel Detail -->
    <g transform="translate(-35, 130)">
      <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
    </g>
    <g transform="translate(35, 130)">
      <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
    </g>
  </g>
  
  <!-- Text Section (All in white) -->
  <g transform="translate(140, 75)">
    <text x="0" y="-8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="32" font-weight="600" fill="#FFFFFF" letter-spacing="-0.5px">Surebank</text>
    
    <text x="0" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segue UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="32" font-weight="600" fill="#FFFFFF" letter-spacing="-0.5px">Stores</text>
  </g>
</svg>